<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#101013">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Notebook">
  <meta name="description" content="Student notebook app — editable UI foundation">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/icon-192.png">
  <link rel="stylesheet" href="src/styles/skeleton.css">
  <title>Notebook — Foundation</title>
  <script type="module" src="src/main.js"></script>
</head>
<body>
  <div id="app">
    <header class="shell-header"><strong>Notebook · Foundation</strong><div><span id="save-status" role="status">Initializing…</span> <button id="export-backup" type="button">Export backup</button> <button id="restore-backup" type="button">Restore</button></div></header>
    <div class="shell-body">
      <nav id="navigation" aria-label="App sections"></nav>
      <main id="screen" tabindex="-1" aria-live="polite"></main>
    </div>
    <footer class="shell-footer">Minimal development UI • Replace <code>src/ui/</code> and <code>src/styles/</code> with your own designs</footer>
  </div>
  <input id="restore-file" type="file" accept="application/json,.json" hidden>
  <input id="attach-file" type="file" accept="application/pdf,image/png,image/jpeg,text/plain" hidden>
</body>
</html>
