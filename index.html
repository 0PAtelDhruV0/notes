<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#101015">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Notes">
<meta name="description" content="Notes — a focused iPad study workspace with offline-first notebooks.">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="stylesheet" href="./src/styles/notes.css">
<title>Notes — Study Space</title>
<script type="module" src="./src/main.js"></script>
</head>
<body>
<div id="app">
<header class="shell-header">
<div class="top-crumb"><span>WORKSPACE</span><span class="chevron">›</span><strong id="screen-location">Overview</strong></div>
<div class="header-actions">
<label class="header-search"><span aria-hidden="true">⌕</span><input id="header-search" aria-label="Find a note" placeholder="Search your notes…" autocomplete="off"><small>⌘ K</small></label>
<span id="save-status" role="status" aria-live="polite">Starting…</span>
<button type="button" id="export-backup" title="Export notes backup">⇩ <span>Backup</span></button>
<button type="button" id="restore-backup" title="Restore notes backup">⇧ <span>Restore</span></button>
</div></header>
<div class="shell-body">
<nav id="navigation" aria-label="Notebook sections"></nav>
<main id="screen" tabindex="-1"></main>
</div>
<footer class="shell-footer">Saved on this device · Export backups regularly</footer>
</div>
<input id="restore-file" type="file" accept="application/json,.json" hidden>
<input id="attach-file" type="file" accept="application/pdf,image/png,image/jpeg,text/plain" hidden>
</body>
</html>
